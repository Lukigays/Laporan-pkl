<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    
    <title>LAPORAN PKL BY LUKYY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2525190538790152" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc; 
            background-image: 
                radial-gradient(at 10% 10%, hsla(228, 100%, 74%, 0.3) 0px, transparent 50%),
                radial-gradient(at 90% 90%, hsla(278, 100%, 74%, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 50%, hsla(168, 100%, 74%, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.dark-mode {
            background-color: #0b1120;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 10%, hsla(228, 100%, 40%, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, hsla(278, 100%, 40%, 0.15) 0px, transparent 50%);
        }
        
        body.dark-mode .glass-panel { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select { background: rgba(30, 41, 59, 0.7) !important; color: #ffffff !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
        body.dark-mode input::placeholder, body.dark-mode textarea::placeholder { color: #64748b; }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-600 { color: #cbd5e1 !important; }
        body.dark-mode .text-gray-500 { color: #94a3b8 !important; }
        body.dark-mode .bg-white\/50 { background: rgba(30, 41, 59, 0.5) !important; border-color: rgba(255, 255, 255, 0.05); }
        body.dark-mode .bg-white { background: #1e293b !important; color: #f1f5f9; }
        body.dark-mode .border-gray-200 { border-color: #334155 !important; }
        body.dark-mode .text-gray-800 { color: #f8fafc !important; }
        
        /* Tambahan style dark-mode spesifik untuk loading screen agar mengikuti tombol manual */
        body.dark-mode #loading-screen { background-color: #0b1120; }
        body.dark-mode #loading-screen h2 { color: #ffffff; }
        body.dark-mode #loading-screen .border-gray-200 { border-color: #1e293b; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        input[type="date"], input[type="text"], input[type="file"], textarea, select { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); border-color: #3b82f6; background: rgba(255, 255, 255, 0.95); }
        button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.96); }

        /* Style Area Print Mutlak */
        .area-kertas { font-family: "Times New Roman", Times, serif; background-color: white !important; color: black !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); }
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .area-kertas table { border: 1px solid black !important; border-collapse: collapse !important; font-size: 11px !important; width: 100%; min-width: 650px; table-layout: fixed; }
        .area-kertas th, .area-kertas td { border: 1px solid black !important; padding: 6px 8px !important; vertical-align: top; color: black !important; word-break: break-word; }
        .area-kertas th { background-color: #f8f9fa !important; font-weight: bold; text-align: center; }
        .area-kertas th:nth-child(1), .area-kertas td:nth-child(1),
        .area-kertas th:nth-child(2), .area-kertas td:nth-child(2),
        .area-kertas th:nth-child(3), .area-kertas td:nth-child(3) { white-space: nowrap !important; }

        .bulan-container { page-break-inside: auto; }
        .bulan-container:not(:first-child) { break-before: page; page-break-before: always; }
        .bulan-container tr { page-break-inside: avoid; page-break-after: auto; }

        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 5rem; color: rgba(0, 0, 0, 0.04); font-weight: 800; white-space: nowrap; pointer-events: none; z-index: 1; user-select: none; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.1em; }
        .konten-tabel { position: relative; z-index: 10; }
        
        @media (min-width: 768px) { .watermark { font-size: 7rem; } }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .area-kertas { box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            .table-wrapper { overflow-x: visible !important; } 
        }

        .gradient-text { background: linear-gradient(135deg, #2563eb, #7c3aed, #059669); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 300% 300%; animation: gradientMove 5s ease infinite; }
        body.dark-mode .gradient-text { background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399); -webkit-background-clip: text; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .btn-hapus { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; font-weight: 600; padding: 12px 24px; border-radius: 16px; cursor: pointer; }
        .btn-hapus:hover { background-color: #fca5a5; color: white; border-color: #ef4444; }
        body.dark-mode .btn-hapus { background-color: rgba(220, 38, 38, 0.1); color: #f87171; border-color: rgba(248, 113, 113, 0.2); }
        body.dark-mode .btn-hapus:hover { background-color: #dc2626; color: white; }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800 antialiased min-h-screen pb-32 md:pb-8">

    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 z-[100] flex flex-col justify-center items-center bg-[#f8fafc] dark:bg-[#0b1120] transition-opacity duration-700 ease-out">
        <div class="relative flex justify-center items-center">
            <!-- Background Ring -->
            <div class="absolute w-20 h-20 rounded-full border-4 border-gray-200 dark:border-gray-800"></div>
            <!-- Spinning Gradient Ring -->
            <div class="absolute w-20 h-20 rounded-full border-4 border-transparent border-t-blue-600 border-b-indigo-600 animate-spin"></div>
            <!-- Center Icon -->
            <span class="text-2xl animate-bounce mt-1">✨</span>
        </div>
        
        <h2 class="mt-8 text-xl font-extrabold tracking-tight text-gray-800 dark:text-white drop-shadow-sm">
            Menyiapkan Workspace
        </h2>
        <p class="font-bold mt-1 text-sm tracking-widest gradient-text animate-pulse">
            LUKYY
        </p>
    </div>

    <!-- LIGHTBOX FOTO -->
    <div id="lightbox" class="fixed inset-0 z-[99] hidden bg-black/95 backdrop-blur-sm flex justify-center items-center p-4 transition-opacity duration-300" onclick="tutupLightbox()">
        <button onclick="tutupLightbox()" class="absolute top-5 right-5 md:top-10 md:right-10 text-white hover:text-red-500 text-5xl font-light transition-colors">&times;</button>
        <img id="lightboxImg" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- TAB NAVIGATION -->
    <nav class="no-print fixed bottom-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-xl border-t border-gray-200 dark:border-gray-800 p-2 md:relative md:border-none md:bg-transparent md:backdrop-blur-none md:p-0 md:mb-6 md:flex md:justify-center">
        <div class="flex justify-around max-w-sm mx-auto w-full md:w-auto md:gap-4 md:bg-white/60 md:dark:bg-gray-800/60 md:p-1.5 md:rounded-2xl md:shadow-sm md:border md:border-white/20">
            <button onclick="switchTab('input')" id="btnTabInput" class="flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-blue-600 bg-blue-50 dark:bg-blue-900/40 rounded-xl transition-all">
                <span class="text-xl md:text-base">📝</span>
                <span class="text-[11px] md:text-sm font-bold">Input Data</span>
            </button>
            <button onclick="switchTab('laporan')" id="btnTabLaporan" class="flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-gray-500 dark:text-gray-400 hover:text-blue-600 transition-all rounded-xl">
                <span class="text-xl md:text-base">📋</span>
                <span class="text-[11px] md:text-sm font-bold">Laporan</span>
            </button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 no-print mt-2 md:mt-0 mb-6 text-center md:text-left">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight drop-shadow-sm mb-1 flex flex-wrap justify-center md:justify-start items-center gap-2">
                    <span>Laporan PKL by</span> 
                    <span class="gradient-text">LUKYY</span>
                    <span class="text-2xl md:text-3xl">✨</span>
                </h1>
                <p class="text-gray-500 font-medium mt-1 text-sm md:text-base">Sistem Manajemen & Generator Laporan Profesional</p>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleDarkMode()" id="btnDarkMode" class="glass-panel px-4 py-2.5 rounded-2xl shadow-sm hover:-translate-y-1 flex items-center gap-2 text-sm font-bold">
                    🌙 <span>Mode Gelap</span>
                </button>
            </div>
        </div>

        <!-- TAB 1: FORM INPUT -->
        <div id="tabInput" class="transition-opacity duration-300">
            <div class="glass-panel rounded-[2rem] p-6 md:p-8 relative z-20 no-print">
                <h2 class="text-xl font-extrabold mb-6 flex items-center gap-3 text-blue-600 dark:text-blue-400" id="judulForm">
                    <span class="p-2 bg-blue-100 dark:bg-blue-900/50 rounded-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </span>
                    Input Kegiatan Baru
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Pilih Tanggal (Edit)</label>
                        <select id="pilihEdit" class="w-full bg-white/70 rounded-2xl p-3.5 shadow-sm text-sm" onchange="pilihTanggalEdit()">
                            <option value="baru">+ Tambah Laporan Baru</option>
                        </select>
                    </div>
                    <div class="lg:col-span-1">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Tanggal Pelaksanaan</label>
                        <input type="date" id="inputTanggal" class="w-full bg-white/70 rounded-2xl p-3.5 shadow-sm text-sm">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Uraian Kegiatan</label>
                        <textarea id="inputUraian" class="w-full bg-white/70 rounded-2xl p-3.5 shadow-sm text-sm" rows="3" placeholder="Contoh: Merakit jaringan komputer, mendesain logo..."></textarea>
                    </div>
                    <div class="lg:col-span-4">
                        <label class="block text-sm font-bold text-gray-700 mb-2" id="labelFoto">Upload Foto Bukti Kegiatan</label>
                        <div class="flex items-center gap-4">
                            <input type="file" id="inputFoto" accept="image/*" class="w-full md:w-1/2 bg-white/70 rounded-2xl p-3 shadow-sm text-sm file:mr-4 file:py-2.5 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-all cursor-pointer">
                            <p class="text-sm text-blue-500 font-semibold animate-pulse" id="infoFotoEdit" style="display:none;">*Kosongkan jika foto tidak diubah</p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-8 flex flex-wrap gap-4 items-center border-t border-gray-200/50 dark:border-white/10 pt-6">
                    <button onclick="tambahBaris()" class="w-full md:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 px-8 rounded-2xl shadow-xl shadow-blue-500/30 hover:-translate-y-1 flex items-center justify-center gap-2" id="btnTambah">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                        Simpan Laporan
                    </button>
                    <button onclick="batalEdit()" id="btnBatalEdit" class="hidden w-full md:w-auto bg-gray-200 text-gray-700 font-bold py-3.5 px-8 rounded-2xl hover:bg-gray-300 text-center">Batal</button>
                    <button onclick="hapusDataYangDiedit()" id="btnHapusEdit" class="btn-hapus hidden w-full md:w-auto flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>Hapus
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 2: LAPORAN (Tabel & Export) -->
        <div id="tabLaporan" class="hidden transition-opacity duration-300">
            <!-- FILTER & TOOLS -->
            <div class="glass-panel rounded-3xl p-5 md:p-6 mb-6 space-y-5 no-print relative z-10">
                
                <!-- Aksi Utama: Export PDF, Backup, Restore -->
                <div class="flex justify-center w-full border-b border-gray-200/50 dark:border-white/10 pb-5">
                    <button onclick="downloadPDF()" id="btnDownload" class="w-full md:w-1/2 bg-white dark:bg-gray-800 border-2 border-red-100 dark:border-red-900/30 text-gray-800 dark:text-white font-bold py-3 px-6 rounded-2xl shadow-sm hover:bg-red-50 dark:hover:bg-gray-700 flex justify-center items-center gap-2 hover:-translate-y-1 transition-all group">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 group-hover:scale-110 transition-transform" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        Export ke PDF
                    </button>
                </div>

                <div class="flex flex-wrap gap-3 justify-end pb-2 border-b border-gray-200/50 dark:border-white/10 pb-4">
                    <button onclick="backupData()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold py-2.5 px-4 rounded-xl hover:bg-gray-50 shadow-sm transition-all">💾 Backup Data</button>
                    <button onclick="document.getElementById('importFile').click()" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold py-2.5 px-4 rounded-xl hover:bg-gray-50 shadow-sm transition-all">📂 Restore</button>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="restoreData(event)">
                    <button onclick="hapusSemuaData()" class="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 text-xs font-bold py-2.5 px-4 rounded-xl hover:bg-red-100 transition-all">Reset DB</button>
                </div>

                <!-- Filter & Pencarian -->
                <div class="flex flex-col md:flex-row justify-between items-center gap-5 flex-wrap pt-2">
                    <div class="flex items-center gap-3 w-full md:w-auto">
                        <span class="p-2.5 bg-blue-100 dark:bg-blue-900/50 text-blue-600 rounded-xl shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" /></svg></span>
                        <select id="filterBulan" onchange="renderSemuaData()" class="bg-white/80 dark:bg-gray-800 rounded-xl p-3 text-sm font-bold text-gray-700 dark:text-gray-200 w-full md:w-56 shadow-sm border-0 focus:ring-2 focus:ring-blue-500">
                            <option value="SEMUA">Filter: Semua Bulan</option>
                        </select>
                    </div>
                    <div class="relative w-full md:flex-1 max-w-md">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/></svg>
                        </div>
                        <input type="text" id="inputPencarian" oninput="renderSemuaData()" class="bg-white/80 dark:bg-gray-800 rounded-xl p-3 pl-12 text-sm font-bold text-gray-700 dark:text-gray-200 w-full shadow-sm border-0 focus:ring-2 focus:ring-blue-500" placeholder="Cari uraian, tanggal, hari...">
                    </div>
                </div>
                
                <!-- Info Memori -->
                <div class="bg-white/60 dark:bg-gray-800/60 rounded-2xl p-4 border border-white/80 dark:border-gray-700 text-xs flex flex-col gap-2 backdrop-blur-sm">
                    <div class="flex justify-between font-bold text-gray-700 dark:text-gray-300">
                        <span id="labelKapasitasTeks" class="flex items-center gap-1">🗄️ Storage:</span>
                        <span id="persenMemori" class="bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded-md">Menganalisis...</span>
                    </div>
                    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden shadow-inner">
                        <div id="barMemori" class="bg-blue-600 h-2.5 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- AREA KERTAS (TAMPILAN DI WEB) -->
            <div class="area-kertas rounded-xl relative overflow-hidden" id="areaCetak">
                <div class="watermark" id="teksWatermark">LAPORAN PKL BY LUKYY</div>
                <div class="konten-tabel p-6 md:p-10 bg-white" style="background: white !important; color: black !important;">
                    <div id="wadahTabelBulan"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        let dataLaporan = [];
        let indexEditMode = -1; 

        window.onload = async function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('btnDarkMode').innerHTML = '☀️ <span>Mode Terang</span>';
            }

            try {
                const dataDariIndexedDB = await localforage.getItem('laporanPKL');
                if (dataDariIndexedDB !== null) {
                    dataLaporan = dataDariIndexedDB; 
                } else {
                    const dataLama = localStorage.getItem('laporanPKL');
                    if (dataLama) {
                        dataLaporan = JSON.parse(dataLama);
                        await localforage.setItem('laporanPKL', dataLaporan); 
                        localStorage.removeItem('laporanPKL'); 
                    }
                }
            } catch (err) { console.error("Gagal memuat data:", err); }

            renderSemuaData();
            cekKapasitasMemori();

            // --- LOGIKA LOADING SCREEN ---
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                loader.style.opacity = '0'; 
                setTimeout(() => {
                    loader.classList.add('hidden'); 
                }, 700); 
            }, 600); 
        };

        function switchTab(tabName) {
            const tabInput = document.getElementById('tabInput');
            const tabLaporan = document.getElementById('tabLaporan');
            const btnInput = document.getElementById('btnTabInput');
            const btnLaporan = document.getElementById('btnTabLaporan');

            if(tabName === 'input') {
                tabInput.classList.remove('hidden');
                tabLaporan.classList.add('hidden');
                
                btnInput.className = "flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-blue-600 bg-blue-50 dark:bg-blue-900/40 rounded-xl transition-all";
                btnLaporan.className = "flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-gray-500 dark:text-gray-400 hover:text-blue-600 transition-all rounded-xl";
            } else {
                tabLaporan.classList.remove('hidden');
                tabInput.classList.add('hidden');

                btnLaporan.className = "flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-blue-600 bg-blue-50 dark:bg-blue-900/40 rounded-xl transition-all";
                btnInput.className = "flex md:flex-row flex-col items-center justify-center gap-1 md:gap-2 p-2 w-full md:w-40 px-4 text-gray-500 dark:text-gray-400 hover:text-blue-600 transition-all rounded-xl";
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function bukaLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            lightbox.classList.remove('hidden');
            setTimeout(() => { img.classList.replace('scale-95', 'scale-100'); }, 10);
        }

        function tutupLightbox() {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 150);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            const btn = document.getElementById('btnDarkMode');
            btn.innerHTML = isDark ? '☀️ <span>Mode Terang</span>' : '🌙 <span>Mode Gelap</span>';
        }

        async function cekKapasitasMemori() {
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const estimate = await navigator.storage.estimate();
                    const totalBytes = estimate.usage || 0;
                    const maxBytes = estimate.quota || (500 * 1024 * 1024); 
                    
                    let persentase = (totalBytes / maxBytes) * 100;
                    if (persentase > 100) persentase = 100;

                    const bar = document.getElementById('barMemori');
                    const teksPersen = document.getElementById('persenMemori');
                    const teksInfo = document.getElementById('labelKapasitasTeks');

                    bar.style.width = persentase.toFixed(1) + '%';
                    const usageMB = (totalBytes / (1024 * 1024)).toFixed(2);
                    teksPersen.innerText = `${persentase.toFixed(2)}% terpakai (${usageMB} MB)`;

                    if (persentase < 60) {
                        bar.className = "bg-green-500 h-2.5 rounded-full transition-all duration-700 ease-out";
                        teksInfo.innerHTML = "🗄️ Storage Browser: Sangat Aman 🟢";
                    } else if (persentase < 85) {
                        bar.className = "bg-yellow-500 h-2.5 rounded-full transition-all duration-700 ease-out";
                        teksInfo.innerHTML = "🗄️ Storage Browser: Mulai Penuh 🟡";
                    } else {
                        bar.className = "bg-red-500 h-2.5 rounded-full transition-all duration-700 ease-out";
                        teksInfo.innerHTML = "🗄️ Storage Browser: HAMPIR PENUH 🔴";
                    }
                } catch (e) { console.error("Gagal menghitung memori", e); }
            }
        }

        function pilihTanggalEdit() {
            const select = document.getElementById('pilihEdit');
            const val = select.value;
            if (val === 'baru') {
                batalEdit();
                return;
            }

            const index = dataLaporan.findIndex(item => item.tanggal === val);
            if (index === -1) return;

            indexEditMode = index;
            const item = dataLaporan[index];
            const parts = item.tanggal.split('/');
            document.getElementById('inputTanggal').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            document.getElementById('inputUraian').value = item.uraian;
            document.getElementById('judulForm').innerHTML = '<span class="p-2 bg-amber-100 dark:bg-amber-900/50 text-amber-600 rounded-xl">✏️</span> Edit Kegiatan PKL';
            document.getElementById('btnTambah').innerHTML = "💾 Update Laporan";
            document.getElementById('btnBatalEdit').classList.remove('hidden');
            document.getElementById('btnHapusEdit').classList.remove('hidden');
            document.getElementById('infoFotoEdit').style.display = 'block';
            document.getElementById('inputFoto').value = '';
        }

        function tambahBaris() {
            const btn = document.getElementById('btnTambah');
            const tanggalInput = document.getElementById('inputTanggal').value;
            const uraian = document.getElementById('inputUraian').value;
            const fotoInput = document.getElementById('inputFoto');

            if(!tanggalInput || !uraian) {
                alert('Harap isi Tanggal dan Uraian Kegiatan terlebih dahulu!');
                return;
            }

            btn.innerHTML = "⏳ Memproses...";
            btn.disabled = true;

            const dateObj = new Date(tanggalInput);
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const hari = namaHari[dateObj.getDay()];
            
            const tgl = String(dateObj.getDate()).padStart(2, '0');
            const bln = String(dateObj.getMonth() + 1).padStart(2, '0');
            const thn = dateObj.getFullYear();
            const tanggalFormat = `${tgl}/${bln}/${thn}`;
            
            const namaBulanArr = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const labelBulan = `${namaBulanArr[dateObj.getMonth()]} ${thn}`;

            if (indexEditMode > -1 && (!fotoInput.files || fotoInput.files.length === 0)) {
                const fotoLama = dataLaporan[indexEditMode].foto;
                simpanKeArray(hari, tanggalFormat, uraian, fotoLama, labelBulan);
                btn.disabled = false;
                return;
            }

            if(fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        simpanKeArray(hari, tanggalFormat, uraian, canvas.toDataURL('image/jpeg', 0.6), labelBulan);
                        btn.disabled = false;
                    }
                }
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                simpanKeArray(hari, tanggalFormat, uraian, '', labelBulan);
                btn.disabled = false;
            }
        }

        async function simpanKeArray(hari, tanggal, uraian, fotoBase64, labelBulan) {
            const dataBaru = { hari: hari, tanggal: tanggal, uraian: uraian, foto: fotoBase64, bulanLabel: labelBulan };
            const backupDataSebelumError = JSON.stringify(dataLaporan);
            
            if (indexEditMode > -1) {
                dataLaporan[indexEditMode] = dataBaru;
                batalEdit(); 
            } else {
                dataLaporan.push(dataBaru);
            }
            
            try {
                dataLaporan.sort((a, b) => {
                    let partA = a.tanggal.split('/'); 
                    let partB = b.tanggal.split('/'); 
                    return parseInt(partA[2] + partA[1] + partA[0]) - parseInt(partB[2] + partB[1] + partB[0]); 
                });
                await localforage.setItem('laporanPKL', dataLaporan);
                renderSemuaData();
                cekKapasitasMemori();
                batalEdit();
                
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                switchTab('laporan'); 
            } catch (e) {
                alert("⚠️ Gagal menyimpan! Storage browser penuh.");
                dataLaporan = JSON.parse(backupDataSebelumError); 
            }
        }

        async function hapusDataYangDiedit() {
            if (indexEditMode === -1) return;
            if (!confirm(`Yakin ingin menghapus data tanggal ${dataLaporan[indexEditMode].tanggal}?`)) return;
            dataLaporan.splice(indexEditMode, 1);
            await localforage.setItem('laporanPKL', dataLaporan);
            batalEdit();
            renderSemuaData();
            cekKapasitasMemori();
        }

        function renderSemuaData() {
            const selectFilter = document.getElementById('filterBulan');
            const currentFilter = selectFilter.value;
            selectFilter.innerHTML = '<option value="SEMUA">Filter: Semua Bulan</option>';
            
            const inputPencarian = document.getElementById('inputPencarian');
            const kataKunci = inputPencarian ? inputPencarian.value.toLowerCase() : '';
            
            const daftarBulanUnik = [...new Set(dataLaporan.map(item => item.bulanLabel))];
            daftarBulanUnik.forEach(bulan => {
                const opt = document.createElement('option');
                opt.value = bulan;
                opt.innerText = bulan;
                selectFilter.appendChild(opt);
            });

            selectFilter.value = daftarBulanUnik.includes(currentFilter) ? currentFilter : 'SEMUA';

            const selectEdit = document.getElementById('pilihEdit');
            const currentEditVal = selectEdit.value;
            selectEdit.innerHTML = '<option value="baru">+ Tambah Laporan Baru</option>';
            dataLaporan.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.tanggal;
                opt.innerText = item.tanggal + ' - ' + item.uraian.substring(0,25) + '...';
                selectEdit.appendChild(opt);
            });
            selectEdit.value = dataLaporan.some(item => item.tanggal === currentEditVal) ? currentEditVal : 'baru';

            const filterAktif = selectFilter.value;
            const wadahTabel = document.getElementById('wadahTabelBulan');
            wadahTabel.innerHTML = '';
            
            if (dataLaporan.length === 0) {
                wadahTabel.innerHTML = '<div class="text-center py-8 text-gray-400 font-medium italic">Belum ada data kegiatan.</div>';
                return;
            }

            let bulanYangDirender = filterAktif === 'SEMUA' ? daftarBulanUnik : [filterAktif];
            let dataDitemukan = false;

            bulanYangDirender.forEach((bulan, iBulan) => {
                const dataBulanIni = dataLaporan.filter(item => {
                    const cocokPencarian = item.uraian.toLowerCase().includes(kataKunci) || item.tanggal.includes(kataKunci) || item.hari.toLowerCase().includes(kataKunci);
                    return item.bulanLabel === bulan && cocokPencarian;
                });

                if (dataBulanIni.length > 0) {
                    dataDitemukan = true;
                    
                    const containerBulan = document.createElement('div');
                    containerBulan.className = 'mb-12 bulan-container'; 
                    
                    let htmlTabel = `
                        <div class="mb-4 text-base font-bold tracking-wide" style="color: black !important;">
                            <p class="mb-1">1. &nbsp;&nbsp;Laporan Kegiatan Harian</p>
                            <p>b. &nbsp;&nbsp;Bulan <span class="uppercase">${bulan}</span></p>
                        </div>
                        <div class="table-wrapper">
                            <table class="w-full border-collapse" style="color: black !important; table-layout: fixed; width: 100%;">
                                <thead>
                                    <tr>
                                        <th class="w-[6%] text-center uppercase py-2">No</th>
                                        <th class="w-[14%] uppercase py-2">Hari</th>
                                        <th class="w-[18%] uppercase py-2">Tanggal</th>
                                        <th class="w-[42%] uppercase py-2">Uraian Kegiatan PKL</th>
                                        <th class="w-[20%] text-center uppercase py-2">Foto Kegiatan</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    let noUrut = 1;
                    dataBulanIni.forEach((item, index) => {
                        const uraianFormatted = item.uraian.replace(/\n/g, '<br>');
                        const fotoHtml = item.foto ? `<img src="${item.foto}" onclick="bukaLightbox(this.src)" class="cursor-pointer hover:opacity-80 transition-all mx-auto rounded-lg shadow-sm border border-gray-200" style="max-width: 80px; max-height: 80px; display: block;" alt="foto">` : '<span class="text-gray-400 italic text-xs">-</span>';
                        const styleBorderBottom = (index === dataBulanIni.length - 1) ? 'border-bottom: 2px solid black !important;' : '';

                        htmlTabel += `
                            <tr>
                                <td class="text-center font-bold" style="color: black !important; word-break: break-word; ${styleBorderBottom}">${noUrut}</td>
                                <td style="color: black !important; word-break: break-word; ${styleBorderBottom}">${item.hari}</td>
                                <td style="color: black !important; word-break: break-word; ${styleBorderBottom}">${item.tanggal}</td>
                                <td style="color: black !important; word-break: break-word; white-space: pre-wrap; ${styleBorderBottom}" class="leading-relaxed">${uraianFormatted}</td>
                                <td class="text-center align-middle" style="${styleBorderBottom}">${fotoHtml}</td>
                            </tr>
                        `;
                        noUrut++;
                    });
                    htmlTabel += `</tbody></table></div>`;
                    containerBulan.innerHTML = htmlTabel;
                    wadahTabel.appendChild(containerBulan);
                }
            });

            if (!dataDitemukan) wadahTabel.innerHTML = '<div class="text-center py-8 text-gray-500 font-medium italic">Pencarian tidak ditemukan.</div>';
        }

        function batalEdit() {
            indexEditMode = -1;
            document.getElementById('judulForm').innerHTML = '<span class="p-2 bg-blue-100 dark:bg-blue-900/50 rounded-xl"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg></span> Input Kegiatan Baru';
            document.getElementById('btnTambah').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg> Simpan Laporan';
            document.getElementById('btnBatalEdit').classList.add('hidden');
            document.getElementById('btnHapusEdit').classList.add('hidden');
            document.getElementById('infoFotoEdit').style.display = "none";
            document.getElementById('inputTanggal').value = '';
            document.getElementById('inputUraian').value = '';
            document.getElementById('inputFoto').value = '';
            document.getElementById('pilihEdit').value = 'baru';
        }

        function backupData() {
            if(dataLaporan.length === 0) return alert("Tabel kosong.");
            const blob = new Blob([JSON.stringify(dataLaporan, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Backup_Data_PKL_LUKYY.json"; a.click(); URL.revokeObjectURL(url);
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(Array.isArray(parsed)) {
                        dataLaporan = parsed;
                        await localforage.setItem('laporanPKL', dataLaporan);
                        document.getElementById('inputPencarian').value = ''; 
                        renderSemuaData();
                        cekKapasitasMemori();
                        alert("✅ Restore berhasil!");
                    } else alert("❌ File tidak valid.");
                } catch (err) { alert("❌ Gagal membaca file."); }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        async function hapusSemuaData() {
            if(confirm("⚠️ Kosongkan semua data laporan?")) {
                await localforage.removeItem('laporanPKL');
                dataLaporan = [];
                batalEdit();
                document.getElementById('inputPencarian').value = '';
                renderSemuaData();
                cekKapasitasMemori();
            }
        }

        function downloadPDF() {
            const filterAktif = document.getElementById('filterBulan').value;
            if (filterAktif === 'SEMUA') {
                alert("⚠️ Harap pilih spesifik 'Bulan' pada menu Filter sebelum meng-export PDF!");
                document.getElementById('filterBulan').focus();
                return; 
            }

            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                const lanjutExport = confirm("⚠️ PERHATIAN UNTUK PENGGUNA HP ⚠️\n\nJika hasil PDF terpotong atau tabel kosong, mohon AKTIFKAN fitur 'Situs Desktop' (Desktop Site) di browser Anda sebelum menekan tombol Export.\n\nLanjutkan export PDF?");
                if (!lanjutExport) {
                    return; 
                }
            }

            const btn = document.getElementById('btnDownload');
            const textAsli = btn.innerHTML;
            btn.innerHTML = "⏳ Generating PDF...";
            btn.disabled = true;

            const inputPencarian = document.getElementById('inputPencarian');
            const teksPencarianSaatIni = inputPencarian ? inputPencarian.value : '';
            
            if (teksPencarianSaatIni !== '') {
                inputPencarian.value = '';
                renderSemuaData(); 
            }

            setTimeout(() => {
                const elemenAsli = document.getElementById('areaCetak');
                const originalWidth = elemenAsli.style.width;
                const originalMaxWidth = elemenAsli.style.maxWidth;
                const originalOverflow = elemenAsli.style.overflow;
                
                elemenAsli.style.width = '794px';
                elemenAsli.style.maxWidth = '794px';
                elemenAsli.style.overflow = 'visible';

                const namaFile = filterAktif === 'SEMUA' ? 'Laporan_PKL_LUKYY.pdf' : `Laporan_PKL_LUKYY_${filterAktif}.pdf`;

                const opsiPDF = {
                    margin:       10,
                    filename:     namaFile,
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true,
                        windowWidth: 794,
                        width: 794,
                        scrollY: 0,
                        scrollX: 0
                    }, 
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak:    { mode: ['css', 'legacy'] } 
                };

                html2pdf().set(opsiPDF).from(elemenAsli).save().then(() => {
                    elemenAsli.style.width = originalWidth;
                    elemenAsli.style.maxWidth = originalMaxWidth;
                    elemenAsli.style.overflow = originalOverflow;

                    if (teksPencarianSaatIni !== '') {
                        inputPencarian.value = teksPencarianSaatIni;
                        renderSemuaData();
                    }
                    btn.innerHTML = textAsli;
                    btn.disabled = false;
                    
                    confetti({
                        particleCount: 100,
                        spread: 90,
                        origin: { y: 0.5 }
                    });

                }).catch(err => {
                    elemenAsli.style.width = originalWidth;
                    elemenAsli.style.maxWidth = originalMaxWidth;
                    elemenAsli.style.overflow = originalOverflow;
                    
                    alert("Gagal membuat PDF. Coba kembali atau gunakan browser lain.");
                    console.error(err);
                    btn.innerHTML = textAsli;
                    btn.disabled = false;
                });
            }, 600); 
        }
    </script>
