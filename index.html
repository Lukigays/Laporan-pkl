<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPORAN PKL BY LUKYY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f2f2f7; 
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background-color: #0f172a;
            color: #f1f5f9;
            background-image: none;
        }
        body.dark-mode .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select {
            background: rgba(15, 23, 42, 0.6) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        body.dark-mode input::placeholder, body.dark-mode textarea::placeholder {
            color: #94a3b8;
        }
        body.dark-mode .text-gray-700, body.dark-mode .text-gray-500, body.dark-mode .text-gray-600 {
            color: #cbd5e1 !important;
        }
        body.dark-mode .bg-white\/50 {
            background: rgba(30, 41, 59, 0.4) !important;
        }
        body.dark-mode .bg-white {
            background: #1e293b !important;
            color: #f1f5f9;
        }
        body.dark-mode .border-gray-200 {
            border-color: #334155 !important;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        input[type="date"], input[type="file"], textarea, select {
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:active {
            transform: scale(0.95);
        }

        /* Area Kertas Dokumen */
        .area-kertas {
            font-family: "Times New Roman", Times, serif;
            background-color: white !important;
            color: black !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            /* Dihapus min-h-screen agar tidak membuat blank page di PDF */
        }
        
        .area-kertas table, .area-kertas th, .area-kertas td {
            border: 1px solid black !important;
            border-collapse: collapse;
            color: black !important;
        }
        
        .area-kertas th, .area-kertas td {
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        /* Mencegah baris tabel terpotong di tengah saat beda halaman PDF */
        tr {
            page-break-inside: avoid !important;
        }
        
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 4rem;
            color: rgba(0, 0, 0, 0.08);
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }
        
        .konten-tabel { position: relative; z-index: 10; }
        
        @media (min-width: 768px) {
            .watermark { font-size: 6rem; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .area-kertas { box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800 antialiased">

    <!-- Modal Lightbox (Untuk Pop-up Foto) -->
    <div id="lightbox" class="fixed inset-0 z-[99] hidden bg-black/90 flex justify-center items-center p-4 transition-opacity duration-300" onclick="tutupLightbox()">
        <button onclick="tutupLightbox()" class="absolute top-5 right-5 md:top-10 md:right-10 text-white hover:text-red-500 text-4xl font-bold transition-colors">&times;</button>
        <img id="lightboxImg" src="" class="max-w-full max-h-full rounded-lg shadow-2xl scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Tombol Dark Mode Switcher -->
        <div class="flex justify-between items-center mb-2 no-print mt-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-sm">Laporan PKL Generator</h1>
                <p class="text-gray-500 text-xs md:text-sm font-medium">Create, manage, and export your reports easily.</p>
            </div>
            <button onclick="toggleDarkMode()" id="btnDarkMode" class="glass-panel p-3 rounded-2xl shadow-sm hover:scale-105 flex items-center gap-2 text-sm font-semibold">
                🌙 <span class="hidden md:inline">Mode Gelap</span>
            </button>
        </div>

        <!-- Panel Input -->
        <div class="glass-panel rounded-3xl p-6 md:p-8 relative z-20 no-print">
            <h2 class="text-lg font-bold mb-5 flex items-center gap-2 text-blue-600" id="judulForm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                Input Kegiatan Baru
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal</label>
                    <input type="date" id="inputTanggal" class="w-full border-0 bg-white/60 rounded-2xl p-3 shadow-sm text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Uraian Kegiatan</label>
                    <textarea id="inputUraian" class="w-full border-0 bg-white/60 rounded-2xl p-3 shadow-sm text-sm" rows="3" placeholder="Contoh: Membersihkan transmisi..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2" id="labelFoto">Foto Kegiatan</label>
                    <input type="file" id="inputFoto" accept="image/*" class="w-full border-0 bg-white/60 rounded-2xl p-3 shadow-sm text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <p class="text-xs text-blue-500 mt-2 font-medium" id="infoFotoEdit" style="display:none;">*Kosongkan jika foto tetap sama</p>
                </div>
            </div>
            
            <div class="mt-6 flex flex-wrap gap-3">
                <button onclick="tambahBaris()" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3 px-6 rounded-2xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50" id="btnTambah">
                    ✨ Tambah Laporan
                </button>
                <button onclick="batalEdit()" id="btnBatalEdit" class="hidden bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-2xl hover:bg-gray-300">
                    Batal Edit
                </button>
                
                <button onclick="downloadPDF()" id="btnDownload" class="ml-auto bg-white border border-gray-200 text-gray-800 font-semibold py-3 px-6 rounded-2xl shadow-sm hover:bg-gray-50 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    Simpan PDF
                </button>
            </div>
        </div>

        <!-- Panel Filter, Backup, & Indikator Memori -->
        <div class="glass-panel rounded-2xl p-4 space-y-4 no-print relative z-10">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <span class="p-2 bg-blue-100 text-blue-600 rounded-xl"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z" clip-rule="evenodd" /></svg></span>
                    <select id="filterBulan" onchange="renderSemuaData()" class="border-0 bg-white/70 rounded-xl p-2.5 text-sm font-semibold text-gray-700 w-full md:w-48 shadow-sm">
                        <option value="SEMUA">Semua Bulan</option>
                    </select>
                </div>
                
                <div class="flex flex-wrap gap-2 w-full md:w-auto md:justify-end">
                    <button onclick="backupData()" class="bg-white border border-gray-200 text-gray-600 text-sm font-semibold py-2 px-4 rounded-xl hover:bg-gray-50 shadow-sm">
                        💾 Backup (.json)
                    </button>
                    <button onclick="document.getElementById('importFile').click()" class="bg-white border border-gray-200 text-gray-600 text-sm font-semibold py-2 px-4 rounded-xl hover:bg-gray-50 shadow-sm">
                        📂 Restore
                    </button>
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="restoreData(event)">
                    <button onclick="hapusSemuaData()" class="bg-red-50 text-red-600 border border-red-100 text-sm font-semibold py-2 px-4 rounded-xl hover:bg-red-100">
                        Kosongkan Data
                    </button>
                </div>
            </div>

            <!-- Indikator Kapasitas Memori Browser -->
            <div class="bg-white/50 rounded-xl p-3 border border-white/60 text-xs flex flex-col gap-1.5">
                <div class="flex justify-between font-semibold text-gray-600">
                    <span id="labelKapasitasTeks">Kapasitas Penyimpanan Browser (LocalStorage):</span>
                    <span id="persenMemori">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div id="barMemori" class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Area Kertas Dokumen -->
        <div class="area-kertas rounded-xl relative overflow-hidden" id="areaCetak">
            <div class="watermark" id="teksWatermark">LAPORAN PKL BY LUKYY</div>

            <div class="konten-tabel p-6 md:p-12 bg-white/50" style="background: white !important; color: black !important;">
                <div class="mb-8 text-lg font-bold" style="color: black !important;">
                    <p class="mb-1">1. &nbsp;&nbsp;Laporan Kegiatan Harian</p>
                    <p>b. &nbsp;&nbsp;Bulan <span id="labelBulan">...</span></p>
                </div>

                <table class="w-full text-sm md:text-base" style="color: black !important;">
                    <thead>
                        <tr>
                            <th class="w-10 text-center">No</th>
                            <th class="w-24">Hari</th>
                            <th class="w-32">Tanggal</th>
                            <th>Uraian kegiatan pkl</th>
                            <th class="w-48 text-center">Foto kegiatan</th>
                            <!-- Kolom Aksi kita berikan class 'kolom-aksi' khusus untuk mempermudah hide saat PDF -->
                            <th class="w-20 text-center no-print kolom-aksi">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let dataLaporan = JSON.parse(localStorage.getItem('laporanPKL')) || [];
        let indexEditMode = -1; 

        window.onload = function() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('btnDarkMode').innerHTML = '☀️ <span class="hidden md:inline">Mode Terang</span>';
            }
            renderSemuaData();
            cekKapasitasMemori();
        };

        // FUNGSI LIGHTBOX (FOTO BESAR)
        function bukaLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            lightbox.classList.remove('hidden');
            setTimeout(() => { img.classList.replace('scale-95', 'scale-100'); }, 10);
        }

        function tutupLightbox() {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 150);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            
            const btn = document.getElementById('btnDarkMode');
            if (isDark) {
                btn.innerHTML = '☀️ <span class="hidden md:inline">Mode Terang</span>';
            } else {
                btn.innerHTML = '🌙 <span class="hidden md:inline">Mode Gelap</span>';
            }
        }

        function cekKapasitasMemori() {
            let totalBytes = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    totalBytes += ((localStorage[key].length + key.length) * 2); 
                }
            }
            const maxBytes = 5 * 1024 * 1024;
            let persentase = (totalBytes / maxBytes) * 100;
            if (persentase > 100) persentase = 100;

            const bar = document.getElementById('barMemori');
            const teksPersen = document.getElementById('persenMemori');
            const teksInfo = document.getElementById('labelKapasitasTeks');

            bar.style.width = persentase.toFixed(1) + '%';
            teksPersen.innerText = persentase.toFixed(1) + '% terpakai';

            if (persentase < 60) {
                bar.className = "bg-green-500 h-2 rounded-full transition-all duration-500";
                teksInfo.innerText = "Kapasitas Memori Browser: Aman 🟢";
            } else if (persentase < 85) {
                bar.className = "bg-yellow-500 h-2 rounded-full transition-all duration-500";
                teksInfo.innerText = "Kapasitas Memori Browser: Mulai Penuh 🟡";
            } else {
                bar.className = "bg-red-500 h-2 rounded-full transition-all duration-500";
                teksInfo.innerText = "Kapasitas Memori Browser: HAMPIR PENUH 🔴";
            }
        }

        function tambahBaris() {
            const btn = document.getElementById('btnTambah');
            const tanggalInput = document.getElementById('inputTanggal').value;
            const uraian = document.getElementById('inputUraian').value;
            const fotoInput = document.getElementById('inputFoto');

            if(!tanggalInput || !uraian) {
                alert('Harap isi Tanggal dan Uraian Kegiatan terlebih dahulu!');
                return;
            }

            btn.innerHTML = "⏳ Memproses...";
            btn.disabled = true;

            const dateObj = new Date(tanggalInput);
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const hari = namaHari[dateObj.getDay()];
            
            const tgl = String(dateObj.getDate()).padStart(2, '0');
            const bln = String(dateObj.getMonth() + 1).padStart(2, '0');
            const thn = dateObj.getFullYear();
            const tanggalFormat = `${tgl}/${bln}/${thn}`;
            const labelBulan = updateLabelBulan(dateObj.getMonth(), thn);

            if(fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const fotoKompres = canvas.toDataURL('image/jpeg', 0.6);
                        simpanKeArray(hari, tanggalFormat, uraian, fotoKompres, labelBulan);
                        btn.disabled = false;
                    }
                }
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                let fotoFinal = '';
                if (indexEditMode > -1) {
                    fotoFinal = dataLaporan[indexEditMode].foto;
                }
                simpanKeArray(hari, tanggalFormat, uraian, fotoFinal, labelBulan);
                btn.disabled = false;
            }
        }

        function simpanKeArray(hari, tanggal, uraian, fotoBase64, labelBulan) {
            const dataBaru = {
                hari: hari,
                tanggal: tanggal,
                uraian: uraian,
                foto: fotoBase64,
                bulanLabel: labelBulan
            };
            
            if (indexEditMode > -1) {
                dataLaporan[indexEditMode] = dataBaru;
                batalEdit(); 
            } else {
                dataLaporan.push(dataBaru);
            }
            
            try {
                dataLaporan.sort((a, b) => {
                    let partA = a.tanggal.split('/'); 
                    let partB = b.tanggal.split('/'); 
                    let numA = parseInt(partA[2] + partA[1] + partA[0]); 
                    let numB = parseInt(partB[2] + partB[1] + partB[0]); 
                    return numA - numB; 
                });
                
                localStorage.setItem('laporanPKL', JSON.stringify(dataLaporan));
                renderSemuaData();
                cekKapasitasMemori();
                
                document.getElementById('inputUraian').value = '';
                document.getElementById('inputFoto').value = '';
                document.getElementById('btnTambah').innerHTML = "✨ Tambah Laporan";
            } catch (e) {
                alert("⚠️ Gagal menyimpan! Memori browser penuh.");
                if(indexEditMode === -1) dataLaporan.pop(); 
            }
        }

        function renderSemuaData() {
            const selectFilter = document.getElementById('filterBulan');
            const currentFilter = selectFilter.value;
            selectFilter.innerHTML = '<option value="SEMUA">Semua Bulan</option>';
            
            const daftarBulanUnik = [...new Set(dataLaporan.map(item => item.bulanLabel))];
            daftarBulanUnik.forEach(bulan => {
                const opt = document.createElement('option');
                opt.value = bulan;
                opt.innerText = bulan;
                selectFilter.appendChild(opt);
            });

            if (daftarBulanUnik.includes(currentFilter)) {
                selectFilter.value = currentFilter;
            } else {
                selectFilter.value = 'SEMUA';
            }

            const filterAktif = selectFilter.value;
            const tbody = document.getElementById('tabelBody');
            tbody.innerHTML = ''; 
            
            let noUrut = 1;

            dataLaporan.forEach((item, index) => {
                if (filterAktif === 'SEMUA' || item.bulanLabel === filterAktif) {
                    const tr = document.createElement('tr');
                    const uraianFormatted = item.uraian.replace(/\n/g, '<br>');
                    // FITUR BARU: Klik foto untuk membesarkan (Cursor ditambahkan)
                    const fotoHtml = item.foto ? `<img src="${item.foto}" onclick="bukaLightbox(this.src)" class="cursor-pointer hover:opacity-80 transition-opacity" style="max-width: 120px; max-height: 120px; display: block; margin: 0 auto; border-radius: 4px;" alt="foto">` : '';

                    tr.innerHTML = `
                        <td class="text-center font-bold" style="color: black !important;">${noUrut}</td>
                        <td style="color: black !important;">${item.hari}</td>
                        <td style="color: black !important;">${item.tanggal}</td>
                        <td style="color: black !important;">${uraianFormatted}</td>
                        <td class="text-center align-middle">${fotoHtml}</td>
                        <td class="text-center align-middle no-print kolom-aksi">
                            <button onclick="editBaris(${index})" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs mb-2 w-full hover:bg-blue-200 font-semibold font-sans">Edit</button>
                            <button onclick="hapusBaris(${index})" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-xs w-full hover:bg-red-200 font-semibold font-sans">Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                    noUrut++; 
                }
            });

            if (filterAktif === 'SEMUA') {
                if (daftarBulanUnik.length > 0) {
                    document.getElementById('labelBulan').innerText = daftarBulanUnik.join(' - ');
                } else {
                    document.getElementById('labelBulan').innerText = '...';
                }
            } else {
                document.getElementById('labelBulan').innerText = filterAktif;
            }
        }

        function editBaris(index) {
            indexEditMode = index;
            const item = dataLaporan[index];
            
            const parts = item.tanggal.split('/'); 
            document.getElementById('inputTanggal').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            document.getElementById('inputUraian').value = item.uraian;
            
            document.getElementById('judulForm').innerHTML = "✏️ Edit Kegiatan PKL";
            document.getElementById('btnTambah').innerHTML = "💾 Simpan Perubahan";
            document.getElementById('btnBatalEdit').classList.remove('hidden');
            document.getElementById('infoFotoEdit').style.display = "block";
            
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        function batalEdit() {
            indexEditMode = -1;
            document.getElementById('judulForm').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg> Input Kegiatan Baru';
            document.getElementById('btnTambah').innerHTML = "✨ Tambah Laporan";
            document.getElementById('btnBatalEdit').classList.add('hidden');
            document.getElementById('infoFotoEdit').style.display = "none";
            
            document.getElementById('inputTanggal').value = '';
            document.getElementById('inputUraian').value = '';
            document.getElementById('inputFoto').value = '';
        }

        function hapusBaris(index) {
            if(confirm("Hapus kegiatan ini?")) {
                dataLaporan.splice(index, 1); 
                localStorage.setItem('laporanPKL', JSON.stringify(dataLaporan));
                renderSemuaData();
                cekKapasitasMemori();
                if(indexEditMode === index) batalEdit();
            }
        }

        function backupData() {
            if(dataLaporan.length === 0) {
                alert("Tabel masih kosong.");
                return;
            }
            const dataStr = JSON.stringify(dataLaporan, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "Backup_Data_PKL.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    if(Array.isArray(parsedData)) {
                        dataLaporan = parsedData;
                        localStorage.setItem('laporanPKL', JSON.stringify(dataLaporan));
                        renderSemuaData();
                        cekKapasitasMemori();
                        alert("✅ Restore berhasil!");
                    } else {
                        alert("❌ File tidak valid.");
                    }
                } catch (err) {
                    alert("❌ Gagal membaca file.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function hapusSemuaData() {
            if(confirm("⚠️ Yakin kosongkan data?")) {
                localStorage.removeItem('laporanPKL');
                dataLaporan = [];
                batalEdit();
                renderSemuaData();
                cekKapasitasMemori();
            }
        }

        function updateLabelBulan(indexBulan, tahun) {
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${namaBulan[indexBulan]} ${tahun}`;
        }

        function downloadPDF() {
            const btn = document.getElementById('btnDownload');
            const elemenCetak = document.getElementById('areaCetak');
            const watermark = document.getElementById('teksWatermark');
            const textAsli = btn.innerHTML;
            
            btn.innerHTML = "⏳ Mengunduh...";
            btn.disabled = true;
            watermark.style.display = 'none';

            // MENCEGAH BUG KOLOM "AKSI" IKUT TERCETAK DI PDF
            const elemenNoPrint = document.querySelectorAll('.kolom-aksi');
            elemenNoPrint.forEach(el => el.style.display = 'none');

            const filterAktif = document.getElementById('filterBulan').value;
            const namaFile = filterAktif === 'SEMUA' ? 'Laporan_PKL.pdf' : `Laporan_PKL_${filterAktif}.pdf`;

            const opsiPDF = {
                margin:       [10, 10, 15, 10], 
                filename:     namaFile,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                // MENCEGAH BUG HALAMAN KOSONG / TERPOTONG
                pagebreak:    { mode: ['css', 'legacy'] } 
            };

            html2pdf().set(opsiPDF).from(elemenCetak).save().then(() => {
                watermark.style.display = 'block';
                // KEMBALIKAN KOLOM AKSI
                elemenNoPrint.forEach(el => el.style.display = '');
                btn.innerHTML = textAsli;
                btn.disabled = false;
            }).catch(err => {
                alert("Gagal membuat PDF.");
                watermark.style.display = 'block';
                elemenNoPrint.forEach(el => el.style.display = '');
                btn.innerHTML = textAsli;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
